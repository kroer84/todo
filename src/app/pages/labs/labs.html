<div class="container">
	<h1>
		{{ variable }}
	</h1>

	<ul>
		<li *ngFor="let task of tasks">
			{{ task }}
		</li>
	</ul>

	<hr />
	<h2>{{ 'Hola mundo - '.repeat(3) }}</h2>
	<p>La suma de 3 + 3 = {{ 3 + 3 }}</p>
	<p>Hola soy {{ name }} y mi edad es {{ age }}</p>
	<hr />
	<!-- <img [src] = "img" alt="">
<input type="text">
<button [disabled]="disabled">click me</button> -->
	<img [src]="person.avatar" alt="" />
	<input type="number" name="" id="" [value]="person.age" />
	<button [disabled]="disabled">click me</button>
	<p>persona: {{ person.name }}</p>
  <button (click)="clickHandler()">click me</button>
  <button (dblclick)="clickHandler()">Doble click</button>
  <div class="contain">
    <p>(change)</p>
    <input type="number" [value]="person.age" (change)="changeHandler($event)">
  </div>
    <div class="contain">
    <p>(keydown)</p>
    <input type="text" [value]="person.name" (keydown)="keydownHandler($event)">
  </div>
</div>
